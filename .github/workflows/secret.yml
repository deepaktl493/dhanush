name: Use Secret Example

on:
  push:
    branches:
      - main

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use API Key as env variable
        env:
          API_KEY: ${{ sk-12345abcXYZ987 }}
        run: |
          echo "Using API key..."
          # Example usage
          curl -H "Authorization: Bearer $API_KEY" https://api.example.com/data
